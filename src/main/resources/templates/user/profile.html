<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Hồ sơ Cá nhân', ~{::contentBlock})}">

<body>
    <div th:fragment="contentBlock">

        <div style="max-width: 800px; margin: 0 auto;">

            <!-- Profile Info Card -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Thông tin tài khoản</h3>
                </div>

                <form th:action="@{/profile/edit}" method="post">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" for="lastName">Họ</label>
                            <input type="text" id="lastName" name="lastName" th:value="${user.lastName}"
                                class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="givenName">Tên đệm & Tên</label>
                            <input type="text" id="givenName" name="givenName" th:value="${user.givenName}"
                                class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email tài khoản</label>
                        <input type="email" th:value="${user.email}" class="form-control" disabled
                            style="background: var(--surface-alt);">
                        <div class="form-hint">Email dùng làm tên đăng nhập và nhận thông báo từ hệ thống.</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" for="departmentId">Môn học</label>
                            <select id="departmentId" name="departmentId" class="form-select" required>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"
                                    th:selected="${user.department != null && dept.id == user.department.id}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="campusId">Phân hiệu</label>
                            <select id="campusId" name="campusId" class="form-select" required>
                                <option th:each="c : ${campuses}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${user.campus != null && c.id == user.campus.id}"></option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">Cập nhật hồ sơ</button>
                    </div>
                </form>
            </div>

            <!-- Change Password Card -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Đổi mật khẩu</h3>
                </div>

                <form th:action="@{/change-password}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                        <input type="password" id="currentPassword" name="currentPassword" class="form-control"
                            placeholder="••••••••" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" for="newPassword">Mật khẩu mới</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control"
                                placeholder="Tối thiểu 8 ký tự, có chữ và số" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="Nhập lại mật khẩu mới" required>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                        <button type="submit" class="btn btn-secondary">Đổi mật khẩu</button>
                    </div>
                </form>
            </div>

        </div>

    </div>
</body>

</html>
