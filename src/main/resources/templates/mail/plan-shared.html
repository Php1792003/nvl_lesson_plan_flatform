<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
        }

        .card {
            max-width: 580px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            color: #075985;
        }

        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 16px;
        }

        .footer {
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            margin-top: 32px;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h2>Giáo án được chia sẻ với Thầy/Cô</h2>
        </div>
        <p>Xin chào <strong th:text="${recipientName}">Thầy/Cô</strong>,</p>
        <p>Đồng nghiệp <strong th:text="${granterName}">Giáo viên</strong> vừa chia sẻ giáo án: <strong
                th:text="${planTitle}">Tiêu đề giáo án</strong> với Thầy/Cô để tham khảo và tải về.</p>

        <p th:if="${expiresAt != null}">
            <em>Thời hạn chia sẻ đến: <span th:text="${expiresAt}">ngày...</span></em>
        </p>

        <div style="text-align: center;">
            <a th:href="${baseUrl} + '/plans/' + ${planId}" class="btn">Xem giáo án</a>
        </div>
        <div class="footer">
            <p>Trường THCS Nguyễn Văn Linh — Hệ thống Quản lý Giáo án điện tử</p>
        </div>
    </div>
</body>

</html>
