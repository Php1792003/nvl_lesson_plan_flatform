<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP đặt lại mật khẩu — THCS Nguyễn Văn Linh</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Nhập mã OTP</h1>
            <p class="auth-subtitle">
                Hệ thống đã gửi mã xác thực tới:<br>
                <strong th:text="${email}" style="color: var(--dark);">giaovien@school.edu.vn</strong>
            </p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/forgot-password/verify}" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <div class="form-group" style="text-align: center;">
                <label class="form-label" for="code">Mã xác thực 6 chữ số</label>
                <input type="text" id="code" name="code" class="otp-field"
                    style="width: 200px; margin: 0 auto; letter-spacing: 8px;" maxlength="6" placeholder="••••••"
                    required autofocus>
                <div class="form-hint" style="margin-top: 10px;">Mã có hiệu lực trong 10 phút.</div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;">Xác thực
                & Tiếp tục</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Chưa nhận được mã?
            <a th:href="@{/forgot-password}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Gửi
                lại yêu cầu</a>
        </div>
    </div>
</body>

</html>
