<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email — THCS Nguyễn Văn Linh</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Xác thực Email</h1>
            <p class="auth-subtitle">
                Hệ thống đã gửi mã OTP 6 chữ số tới email:<br>
                <strong th:text="${user.email}" style="color: var(--dark);">giaovien@school.edu.vn</strong>
            </p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/verify-email(userId=${userId})}" th:object="${verifyOtpRequest}" method="post">
            <div class="form-group" style="text-align: center;">
                <label class="form-label" for="code">Nhập mã xác thực 6 chữ số</label>
                <input type="text" id="code" th:field="*{code}" class="otp-field"
                    style="width: 200px; margin: 0 auto; letter-spacing: 8px;" maxlength="6" placeholder="••••••"
                    required autofocus>
                <div class="form-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                <div class="form-hint" style="margin-top: 10px;">Mã có hiệu lực trong 10 phút. Tối đa 5 lần nhập sai.
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;">Xác thực
                tài khoản</button>
        </form>

        <form th:action="@{/verify-email/resend(userId=${userId})}" method="post"
            style="text-align: center; margin-top: 20px;">
            <button type="submit" class="btn btn-outline btn-sm">Gửi lại mã OTP</button>
        </form>
    </div>
</body>

</html>
