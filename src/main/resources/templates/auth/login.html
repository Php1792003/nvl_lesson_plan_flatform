<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Hệ thống Quản lý Giáo án THCS Nguyễn Văn Linh</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Đăng nhập</h1>
            <p class="auth-subtitle">Cổng quản lý giáo án điện tử trường THCS Nguyễn Văn Linh</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${param.logout}" class="alert alert-success">
            <span>Bạn đã đăng xuất khỏi hệ thống thành công.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                    placeholder="giaovien@school.edu.vn" required autofocus>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <a th:href="@{/forgot-password}"
                        style="font-size: 12px; color: var(--primary); text-decoration: none;">Quên mật khẩu?</a>
                </div>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••"
                    required>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Đăng
                nhập</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Chưa có tài khoản giảng viên?
            <a th:href="@{/register}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Đăng ký
                ngay</a>
        </div>
    </div>
</body>

</html>
