<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email — THCS Nguyễn Văn Linh</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/nvl_logo.png}" style="width: 100px; height: 100px;">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/form-validation.js}" defer></script>
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <img th:src="@{/img/nvl_logo.png}" alt="Nguyễn Văn Linh" style="width: 88px;">
            </div>
            <h1 class="auth-title">Xác thực Email</h1>
            <p class="auth-subtitle">
                Hệ thống đã gửi mã OTP 6 chữ số tới email:<br>
                <strong th:text="${email != null ? email : (user != null ? user.email : '')}" style="color: var(--dark);">giaovien@school.edu.vn</strong>
            </p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="status">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/verify-email}" th:object="${verifyOtpRequest}" method="post" data-validate novalidate>
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="userId" th:if="${userId != null}" th:value="${userId}">
            <div class="form-alert" role="alert" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></div>

            <div class="form-group" style="text-align: center;" th:classappend="${#fields.hasErrors('code')} ? 'has-error'">
                <label class="form-label" for="code">Nhập mã xác thực 6 chữ số <span class="req" aria-hidden="true">*</span></label>
                <input type="text" id="code" th:field="*{code}" class="otp-field"
                       style="width: 200px; max-width: 100%; margin: 0 auto; letter-spacing: 8px;"
                       maxlength="6" placeholder="••••••" required autofocus inputmode="numeric" autocomplete="one-time-code"
                       data-pattern="^[0-9]{6}$"
                       data-msg-required="Vui lòng nhập mã xác thực."
                       data-msg-pattern="Mã xác thực gồm 6 chữ số."
                       th:attr="aria-invalid=${#fields.hasErrors('code')},aria-describedby='code-hint code-error'">
                <p class="field-error" id="code-error" role="alert"
                   th:if="${#fields.hasErrors('code')}" th:text="${#fields.errors('code')[0]}"></p>
                <p class="form-hint" id="code-hint" style="margin-top: 10px;">Mã có hiệu lực trong 10 phút. Tối đa 5 lần nhập sai.</p>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;">Xác thực</button>
        </form>

        <form th:action="@{/verify-email/resend}" method="post"
              style="text-align: center; margin-top: 20px;">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="userId" th:if="${userId != null}" th:value="${userId}">
            <button type="submit" class="btn btn-outline btn-sm">Gửi lại mã</button>
        </form>
    </div>
</body>

</html>
