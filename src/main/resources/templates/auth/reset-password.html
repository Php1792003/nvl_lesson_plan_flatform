<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết lập mật khẩu mới — THCS Nguyễn Văn Linh</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Mật khẩu mới</h1>
            <p class="auth-subtitle">Thiết lập mật khẩu bảo mật mới cho tài khoản của bạn</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
            <input type="hidden" th:field="*{email}">
            <input type="hidden" th:field="*{token}">

            <div class="form-group">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                    placeholder="Tối thiểu 8 ký tự, có chữ và số" required autofocus>
                <div class="form-hint">Tối thiểu 8 ký tự, gồm cả chữ cái và chữ số.</div>
                <div class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                    placeholder="Nhập lại mật khẩu mới" required>
                <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Đổi mật
                khẩu</button>
        </form>
    </div>
</body>

</html>
