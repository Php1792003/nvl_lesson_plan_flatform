<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản — THCS Nguyễn Văn Linh</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Đăng ký tài khoản</h1>
            <p class="auth-subtitle">Dành cho giáo viên trường THCS Nguyễn Văn Linh</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label" for="lastName">Họ</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="Nguyễn"
                        required>
                    <div class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="givenName">Tên đệm & Tên</label>
                    <input type="text" id="givenName" th:field="*{givenName}" class="form-control" placeholder="Văn An"
                        required>
                    <div class="form-error" th:if="${#fields.hasErrors('givenName')}" th:errors="*{givenName}"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                    placeholder="an.nguyen@school.edu.vn" required>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label" for="departmentId">Môn học</label>
                    <select id="departmentId" th:field="*{departmentId}" class="form-select" required>
                        <option value="">-- Chọn bộ môn --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="campusId">Phân hiệu</label>
                    <select id="campusId" th:field="*{campusId}" class="form-select" required>
                        <option th:each="c : ${campuses}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.isDefault}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                    placeholder="Tối thiểu 8 ký tự, có chữ và số" required>
                <div class="form-hint">Tối thiểu 8 ký tự, bao gồm cả chữ cái và chữ số.</div>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                    placeholder="Nhập lại mật khẩu" required>
                <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Đăng
                ký</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Đã có tài khoản?
            <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Đăng nhập</a>
        </div>
    </div>
</body>

</html>
