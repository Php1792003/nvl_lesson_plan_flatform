<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — THCS Nguyễn Văn Linh</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">NVL</div>
            <h1 class="auth-title">Quên mật khẩu</h1>
            <p class="auth-subtitle">Nhập email tài khoản để nhận mã OTP xác thực đặt lại mật khẩu</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Email tài khoản</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="giaovien@school.edu.vn"
                    required autofocus>
                <div class="form-hint">Mã xác thực 6 chữ số sẽ được gửi vào email này.</div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Gửi mã
                OTP</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Quay lại
            <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Đăng nhập</a>
        </div>
    </div>
</body>

</html>
