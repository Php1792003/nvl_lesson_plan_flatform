<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 — Yêu cầu không hợp lệ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card" style="text-align: center;">
    <div style="font-size: 64px; font-weight: 800; color: var(--warning); line-height: 1;">400</div>
    <h1 style="font-size: 20px; font-weight: 700; color: var(--dark); margin: 16px 0 8px;">Yêu cầu không hợp lệ</h1>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;" th:text="${message}">
        Yêu cầu của bạn vi phạm quy tắc hệ thống hoặc dữ liệu gửi lên không đúng định dạng.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-primary" style="width: 100%;">Trở về Bảng điều khiển</a>
</div>
</body>
</html>
