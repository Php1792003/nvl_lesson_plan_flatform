<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout-base :: layout(#{audit.admin.title}, ~{::contentBlock})}">
<body>
<div th:fragment="contentBlock">

    <!-- Filters Card -->
    <div class="card" style="margin-bottom: 20px; padding: 18px 20px;">
        <form th:action="@{/admin/audit-logs}" method="get" class="form-grid" style="align-items: end;">
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 12px;">Hành động (Action)</label>
                <input type="text" name="action" th:value="${action}" class="form-control" placeholder="USER_LOGIN, PLAN_CREATE...">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 12px;">Email người thực hiện</label>
                <input type="text" name="actorEmail" th:value="${actorEmail}" class="form-control" placeholder="email@school.edu.vn">
            </div>

            <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 4px;">
                <button type="submit" class="btn btn-primary" style="min-width: 100px;">Lọc</button>
            </div>
        </form>
    </div>

    <!-- Audit Logs Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Người thực hiện</th>
                    <th>Hành động</th>
                    <th>Đối tượng</th>
                    <th>IP</th>
                    <th>Chi tiết</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${logPage.empty}">
                    <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">
                        Chưa có bản ghi nhật ký nào.
                    </td>
                </tr>
                <tr th:each="log : ${logPage.content}">
                    <td style="white-space: nowrap; font-size: 13px;" th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026 12:00:00</td>
                    <td>
                        <strong style="color: var(--dark);" th:text="${log.actorEmailSnapshot != null ? log.actorEmailSnapshot : 'Khách vãng lai'}">admin@school.edu.vn</strong>
                    </td>
                    <td>
                        <code style="font-size: 12px; background: #eff6ff; color: #1d4ed8; padding: 2px 6px; border-radius: 4px; white-space: nowrap;" th:text="${log.action}">USER_LOGIN</code>
                    </td>
                    <td style="font-size: 13px; white-space: nowrap;" th:text="${log.targetType} + (log.targetId != null ? ' #' + log.targetId : '')">USER #1</td>
                    <td style="font-size: 12px; color: var(--text-muted); white-space: nowrap;" th:text="${log.ip != null ? log.ip : '-'}">127.0.0.1</td>
                    <td style="font-size: 13px; max-width: 320px; word-break: break-word;" th:text="${log.detail}">Chi tiết...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
