<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP đặt lại mật khẩu — THCS Nguyễn Văn Linh</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/nvl_logo.png}" style="width: 100px; height: 100px;">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/form-validation.js}" defer></script>
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <img th:src="@{/img/nvl_logo.png}" alt="Nguyễn Văn Linh" style="width: 88px;">
            </div>
            <h1 class="auth-title">Nhập mã OTP</h1>
            <p class="auth-subtitle">
                Hệ thống đã gửi mã xác thực tới:<br>
                <strong th:text="${email}" style="color: var(--dark);">giaovien@school.edu.vn</strong>
            </p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="status">
            <span th:text="${successMessage}">Thành công!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>

        <form th:action="@{/forgot-password/verify}" th:object="${verifyPasswordResetOtpForm}" method="post" data-validate novalidate>
            <input type="hidden" th:field="*{email}">

            <div class="form-alert" role="alert" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></div>

            <div class="form-group" style="text-align: center;" th:classappend="${#fields.hasErrors('code')} ? 'has-error'">
                <label class="form-label" for="code">Mã xác thực 6 chữ số <span class="req" aria-hidden="true">*</span></label>
                <input type="text" id="code" th:field="*{code}" class="otp-field"
                       style="width: 200px; max-width: 100%; margin: 0 auto; letter-spacing: 8px;"
                       maxlength="6" placeholder="••••••" required autofocus inputmode="numeric" autocomplete="one-time-code"
                       data-pattern="^[0-9]{6}$"
                       data-msg-required="Vui lòng nhập mã xác thực."
                       data-msg-pattern="Mã xác thực gồm 6 chữ số."
                       th:attr="aria-invalid=${#fields.hasErrors('code')},aria-describedby='code-hint code-error'">
                <p class="field-error" id="code-error" role="alert"
                   th:if="${#fields.hasErrors('code')}" th:text="${#fields.errors('code')[0]}"></p>
                <p class="form-hint" id="code-hint" style="margin-top: 10px;">Mã có hiệu lực trong 10 phút.</p>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;">Tiếp tục</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Chưa nhận được mã?
            <a th:href="@{/forgot-password}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Gửi lại yêu cầu</a>
        </div>
    </div>
</body>

</html>
