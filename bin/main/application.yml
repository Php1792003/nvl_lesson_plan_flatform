server:
  port: 8080
  servlet:
    context-path: /portal
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: lesson-plan-management

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=lesson_plan_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:lesson_user}
    password: ${DB_PASSWORD:LessonPassword123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false


  mail:
    # SMTP Server (Hỗ trợ Brevo, Resend, Gmail):
    # - Brevo (Khuyên dùng, miễn phí 300 mail/ngày): host: smtp-relay.brevo.com, port: 587
    # - Resend (Miễn phí 3000 mail/tháng): host: smtp.resend.com, port: 587, user: resend
    # - Gmail: host: smtp.gmail.com, port: 587
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:b44410001@smtp-brevo.com}
    password: ${SMTP_PASSWORD:xsmtpsib-3ace1ee988142e5fb6ad0e1079f27fc8520f2c8856b2bee0be449ed3135e91d3-mkrKPnE4opTS036j}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        transport:
          protocol: smtp
    default-encoding: UTF-8

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  mvc:
    log-resolved-exception: false

  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_MB:10}MB
      max-request-size: ${APP_UPLOAD_MAX_MB:10}MB

  messages:
    basename: messages
    encoding: UTF-8

# Application custom properties
app:
  base-url: ${APP_BASE_URL:http://localhost:8080/portal}
  storage:
    root: ${APP_STORAGE_ROOT:./uploads}
    temp-dir: ${APP_STORAGE_TEMP:./uploads/temp}
  upload:
    max-mb: ${APP_UPLOAD_MAX_MB:20}
    allowed-extensions: pdf,doc,docx,ppt,pptx
    allowed-content-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation
    max-concurrent: ${APP_UPLOAD_MAX_CONCURRENT:3}
    min-disk-mb: ${APP_UPLOAD_MIN_DISK_MB:500}
  keep-versions: ${APP_KEEP_VERSIONS:3}
  version-delete-days: ${APP_VERSION_DELETE_DAYS:30}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6JL-bkqmhHDrD_SZLyKJXwAjlZWSPUZ7TnoJnHdMLPLDQ}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      timeout-seconds: 60
  jwt:
    secret: ${JWT_SECRET:DEFAULT_DEV_SECRET_MUST_BE_AT_LEAST_256_BITS_LONG_CHANGE_IN_PRODUCTION_PLEASE}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  mail:
    from: ${MAIL_FROM:psaigon179@gmail.com}
    sender-name: ${MAIL_SENDER_NAME:THCS Nguyễn Văn Linh}
    dev-mode: ${MAIL_DEV_MODE:false}
  otp:
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-resend-per-hour: 5
  rate-limit:
    login:
      capacity: 10
      refill-minutes: 15
    register:
      capacity: 5
      refill-minutes: 60
    otp:
      capacity: 5
      refill-minutes: 60
    upload:
      capacity: 3
      refill-seconds: 10
  security:
    max-failed-login: 5
    lock-duration-minutes: 30
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:admin@school.edu.vn}
    password: ${INITIAL_ADMIN_PASSWORD:Admin@123456}

ai:
  review:
    min-chars: 100
    max-chars: 30000
    source-label: "Bộ thẩm định Chuẩn Sư phạm"
    legal-basis-path: "classpath:legal-basis.md"
    timeout-seconds: 60
    cache-expire-minutes: 30
    rate-limit-per-minute: 10
    gemini:
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6JL-bkqmhHDrD_SZLyKJXwAjlZWSPUZ7TnoJnHdMLPLDQ}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      api-url: https://generativelanguage.googleapis.com/v1beta/models


logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.resource.NoResourceFoundException: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    com.school.lessonplan: DEBUG
    org.hibernate.orm.deprecation: ERROR
    org.hibernate.orm.incubating: ERROR
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
