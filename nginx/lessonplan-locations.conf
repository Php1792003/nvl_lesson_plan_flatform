# ==============================================================================
# Location blocks cho NVL Lesson Plan Platform
# Được include từ server block chính (lessonplan.conf)
# ==============================================================================

# Thư mục tạm cho Nginx buffer request body - giảm áp lực RAM
client_body_temp_path /var/lib/nginx/client_body_temp 1 2;

# --- Mặc định: giới hạn body 1MB cho các request thông thường ---
client_max_body_size 1m;

# --- Timeout cho việc nhận body (mặc định cho request thường) ---
client_body_timeout 30s;

# === ENDPOINT UPLOAD: /portal/plans (POST) và /portal/plans/*/versions (POST) ===
# Chỉ áp dụng giới hạn cho endpoint upload, KHÔNG ảnh hưởng các endpoint khác.

location ~ ^/portal/plans(/[0-9]+/versions)?$ {
    # Chỉ áp dụng rate limit và giới hạn đặc biệt cho POST (upload)
    # GET vẫn hoạt động bình thường
    limit_except GET HEAD {
        # Rate limit bổ sung theo IP (burst 3, không chờ)
        limit_req zone=upload_per_ip burst=3 nodelay;
        limit_req_status 429;

        # Giới hạn connection đồng thời mỗi IP cho upload
        limit_conn upload_conn_per_ip 2;
        limit_conn_status 503;
    }

    # Body tối đa 22MB (20MB file + multipart overhead)
    client_max_body_size 22m;

    # Timeout nhận body: 5 phút cho upload trên mạng chậm
    # Không đặt quá lớn để tránh giữ connection zombie
    client_body_timeout 300s;

    # Buffer body vào đĩa thay vì RAM (quan trọng cho server RAM 4GB)
    client_body_buffer_size 256k;
    client_body_in_file_only clean;

    proxy_pass http://lessonplan_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout proxy: đủ cho upload lớn trên mạng chậm
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}

# === CÁC ENDPOINT KHÁC: proxy bình thường ===
location /portal/ {
    proxy_pass http://lessonplan_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
}

# === Static files (nếu serve từ Nginx) ===
location /portal/css/ {
    proxy_pass http://lessonplan_backend;
    proxy_cache_valid 200 1d;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

location /portal/js/ {
    proxy_pass http://lessonplan_backend;
    proxy_cache_valid 200 1d;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

location /portal/img/ {
    proxy_pass http://lessonplan_backend;
    proxy_cache_valid 200 7d;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# === Health check (nếu cần) ===
location /portal/actuator/health {
    proxy_pass http://lessonplan_backend;
    access_log off;
}
