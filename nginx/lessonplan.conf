# ==============================================================================
# Nginx Reverse Proxy Configuration for NVL Lesson Plan Platform
# ==============================================================================
#
# Mục đích:
#   - Reverse proxy trước Spring Boot (localhost:8080)
#   - Giới hạn body upload 22MB (20MB file + overhead multipart)
#   - Rate limiting bổ sung tại tầng Nginx (lớp bảo vệ thêm, không thay thế
#     Token Bucket theo tài khoản trong backend)
#   - Giới hạn connection đồng thời cho endpoint upload
#   - Timeout phù hợp cho upload trên mạng chậm
#
# Cách sử dụng:
#   1. Copy file này vào /etc/nginx/sites-available/lessonplan
#   2. Tạo symlink: ln -s /etc/nginx/sites-available/lessonplan /etc/nginx/sites-enabled/
#   3. Kiểm tra cú pháp: nginx -t
#   4. Reload: sudo systemctl reload nginx
#
# LƯU Ý:
#   - Đây là cấu hình mẫu. Cần điều chỉnh server_name, SSL cert, upstream
#     cho phù hợp với môi trường triển khai thực tế.
#   - Nếu Nginx nằm sau một proxy khác (CloudFlare, load balancer), cần cấu
#     hình set_real_ip_from và real_ip_header cho đúng.
# ==============================================================================

# --- Rate limiting zones ---
# Zone cho endpoint upload: 5 request/giây mỗi IP (burst 3, nodelay)
# ĐÂY LÀ LỚP BẢO VỆ BỔ SUNG - không thay thế Token Bucket theo userId trong backend
limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=5r/s;

# Zone giới hạn connection cho upload
limit_conn_zone $binary_remote_addr zone=upload_conn_per_ip:10m;

upstream lessonplan_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;

    # --- Redirect HTTP -> HTTPS (bỏ comment khi đã có SSL) ---
    # return 301 https://$host$request_uri;

    # --- Hoặc dùng trực tiếp HTTP cho development ---
    include /etc/nginx/snippets/lessonplan-locations.conf;
}

